version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: iteh_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./iznajmljivanjevozila-backend
      dockerfile: Dockerfile
    container_name: iteh_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=laravel
      - DB_USERNAME=root
      - DB_PASSWORD=root
    depends_on:
      - db
    volumes:
      - ./iznajmljivanjevozila-backend:/var/www
      - /var/www/vendor

  frontend:
    build:
      context: ./iznajmljivanjevozila-frontend
      dockerfile: Dockerfile
    container_name: iteh_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./iznajmljivanjevozila-frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
